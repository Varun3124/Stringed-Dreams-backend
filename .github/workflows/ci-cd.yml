name: Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch cancels the older, still-running pipeline
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  # ---------------- CI: code quality ----------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  # ---------------- CI: unit + integration tests ----------------
  test:
    name: Test (with MongoDB)
    runs-on: ubuntu-latest
    # A throwaway MongoDB container that lives only for this job
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI_TEST: mongodb://localhost:27017/stringed-dreams-test
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run tests with coverage
        run: npm run test:coverage -- --ci
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: coverage/
          retention-days: 7
      - name: Dependency audit (informational)
        run: npm audit --omit=dev --audit-level=high || true

  # ---------------- Build, smoke-test and publish the Docker image ----------------
  docker:
    name: Docker build & smoke test
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GitHub Container Registry
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true            # keep the image locally for the smoke test
          tags: stringed-dreams-backend:ci
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker network create smoke
          docker run -d --name mongo --network smoke mongo:7
          docker run -d --name api --network smoke -p 5000:5000 \
            -e MONGODB_URI=mongodb://mongo:27017/smoke \
            -e JWT_SECRET=smoke-secret \
            stringed-dreams-backend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/api/health; then
              echo; echo "Container is healthy"; exit 0
            fi
            sleep 2
          done
          echo "Container never became healthy"; docker logs api; exit 1

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # Registry names must be lowercase (the GitHub username has capitals)
          IMAGE_NAME=$(echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/stringed-dreams-backend" | tr '[:upper:]' '[:lower:]')
          docker tag stringed-dreams-backend:ci $IMAGE_NAME:${{ github.sha }}
          docker tag stringed-dreams-backend:ci $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest

  # ---------------- CD: deploy to Render ----------------
  deploy:
    name: Deploy to Render
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.BACKEND_URL }}
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK secret not set - skipping deploy."
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK")
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "Render deploy triggered (HTTP $STATUS)"
          else
            echo "::error::Render deploy hook returned HTTP $STATUS"; exit 1
          fi

      - name: Wait for the new version to go live
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ] || [ -z "$BACKEND_URL" ]; then
            echo "Deploy hook or BACKEND_URL variable not set - skipping verification."; exit 0
          fi
          # Render builds take a few minutes; poll /api/health until it reports this commit
          for i in $(seq 1 40); do
            BODY=$(curl -fsS "$BACKEND_URL/api/health" || true)
            echo "$BODY"
            if echo "$BODY" | grep -q "${{ github.sha }}"; then
              echo "Deployed commit ${{ github.sha }} is live"; exit 0
            fi
            sleep 15
          done
          echo "::error::New version did not go live within 10 minutes"; exit 1
